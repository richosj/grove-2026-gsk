<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
  />
  <meta name="theme-color" content="#050508" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Grove — iPad</title>
  <link rel="stylesheet" href="css/main.css" />
  <!--
    GitHub Pages: 저장소 Settings → Pages → Build and deployment
    Source: Deploy from a branch → Branch: main, Folder: / (root)
    이렇게 두면 main에 push할 때마다 사이트가 갱신됩니다.
  -->
</head>
<body>
  <div class="app-root" id="app">
    <div id="mySwipe" class="swipe">
      <div class="swipe-wrap">
        <div>
          <div class="wrapper page1">
            <div class="slide-backdrop" aria-hidden="true">
            </div>
            <img class="slide-img" src="images/page1.png" aria-label="첫 페이지" draggable="false" />
            <button type="button" id="moveToPage2" aria-label="2페이지 이동"></button>
          </div>
        </div>
        <div>
          <div class="wrapper page2 page2--buttons-pending">
            <div class="slide-backdrop" aria-hidden="true"></div>
            <img class="slide-backdrop__deco" src="images/p2-ite.png" alt="" draggable="false" />
            <img class="slide-img" src="images/page2.png" aria-label="두 번째 페이지" draggable="false" />
            <button type="button" class="popup-btn page2-popup1" data-popup="images/popup1.png"><img src="images/item1.png" alt=""></button>
            <button type="button" class="popup-btn page2-popup2" data-popup="images/popup4.png"><img src="images/item2.png" alt=""></button>
            <button type="button" class="popup-btn page2-popup3" data-popup="images/popup2.png"><img src="images/item3.png" alt=""></button>
            <button type="button" class="popup-btn page2-popup4" data-popup="images/popup5.png"><img src="images/item4.png" alt=""></button>
            <button type="button" class="popup-btn page2-popup5" data-popup="images/popup3.png"><img src="images/item5.png" alt=""></button>
          </div>
        </div>
        <div>
          <div class="wrapper end">
            <div class="slide-backdrop" aria-hidden="true">
              
            </div>
            <img class="slide-img" src="images/end.png" aria-label="마지막 페이지" draggable="false" />
            <button type="button" id="moveToFirstPage" aria-label="첫 페이지 이동"></button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div
    id="lightbox"
    class="lightbox"
    role="dialog"
    aria-modal="true"
    aria-hidden="true"
    aria-label="이미지 확대"
  >
    <button type="button" class="lightbox__backdrop" id="lightboxBackdrop" aria-label="닫기"></button>
    <div class="lightbox__panel">
      <button type="button" class="lightbox__close" id="lightboxClose" aria-label="닫기"></button>
      <img class="lightbox__img" id="lightboxImg" src="" alt="" />
    </div>
  </div>

  <script src="js/swipe.js"></script>
  <script>
    (function () {
      var root = document.getElementById("mySwipe");
      function playPage2IntroIfNeeded(slideIndex) {
        if (slideIndex !== 1) return;
        var page2 = document.querySelector(".page2");
        if (!page2 || !page2.classList.contains("page2--buttons-pending")) return;

        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          page2.classList.remove("page2--buttons-pending");
          page2.classList.add("page2--intro-done");
          return;
        }

        page2.classList.remove("page2--buttons-pending");

        var buttons = page2.querySelectorAll(".popup-btn");
        var n = Math.max(1, buttons.length);
        var leadInMs = 400;
        var shakeStaggerMs = 580;
        var shakeMs = 880;

        buttons.forEach(function (btn, idx) {
          btn.style.setProperty("--shake-delay", leadInMs + idx * shakeStaggerMs + "ms");
        });
        var maxShakeDelay = leadInMs + (n - 1) * shakeStaggerMs;

        void page2.offsetWidth;
        page2.classList.add("page2--intro-shake");
        window.setTimeout(function () {
          page2.classList.remove("page2--intro-shake");
          page2.classList.add("page2--intro-done");
          buttons.forEach(function (btn) {
            btn.style.removeProperty("--shake-delay");
          });
        }, maxShakeDelay + shakeMs + 80);
      }

      var slider =
        root &&
        new Swipe(root, {
          startSlide: 0,
          continuous: true,
          disableScroll: true,
          stopPropagation: false,
          callback: playPage2IntroIfNeeded,
        });

      if (slider) {
        playPage2IntroIfNeeded(slider.getPos());
      }

      function reflowSwipe() {
        if (slider && typeof slider.setup === "function") {
          slider.setup();
        }
      }

      window.addEventListener("resize", reflowSwipe);
      window.addEventListener("orientationchange", function () {
        setTimeout(reflowSwipe, 200);
      });

      document.getElementById("moveToPage2").addEventListener("click", function () {
        slider.slide(1);
      });

      document.getElementById("moveToFirstPage").addEventListener("click", function () {
        slider.slide(0);
      });

      var lb = document.getElementById("lightbox");
      var lbImg = document.getElementById("lightboxImg");
      var lbClose = document.getElementById("lightboxClose");
      var lbBackdrop = document.getElementById("lightboxBackdrop");

      function openLightbox(src) {
        if (!src || !lb || !lbImg) return;
        lbImg.src = src;
        lb.classList.add("lightbox--open");
        lb.setAttribute("aria-hidden", "false");
      }

      function closeLightbox() {
        if (!lb || !lbImg) return;
        lb.classList.remove("lightbox--open");
        lb.setAttribute("aria-hidden", "true");
        window.setTimeout(function () {
          lbImg.removeAttribute("src");
        }, 400);
      }

      document.querySelectorAll("button[data-popup]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var src = btn.getAttribute("data-popup");
          openLightbox(src);
        });
      });

      if (lbClose) lbClose.addEventListener("click", closeLightbox);
      if (lbBackdrop) lbBackdrop.addEventListener("click", closeLightbox);

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeLightbox();
      });
    })();
  </script>
</body>
</html>
